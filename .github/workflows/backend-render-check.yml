name: backend-render-check

on:
  pull_request:
  push:
    branches: [work, main, master]

jobs:
  render-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax checks
        run: |
          python -m py_compile app/services/render_service.py
          python -m compileall app

      - name: Render verification
        run: |
          cd ..
          python scripts/verify_render.py
